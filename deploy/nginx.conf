# doc2dpp on the VPS: /etc/nginx/sites-enabled/doc2dpp.wisecraft.dev. 3400 is PORT in deploy/ecosystem.config.cjs.
# certbot --nginx adds the TLS server block and the HTTP → HTTPS redirect to this file.
server {
    server_name doc2dpp.wisecraft.dev;
    client_max_body_size 55m;  # the canister takes Documents up to 50 MB

    # MCP over streamable HTTP: responses may stream as server-sent events, so never buffer them.
    location /mcp {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 80;
    listen [::]:80;
}
